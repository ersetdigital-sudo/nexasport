# Base44 development environment for Nexa Sport admin panel.
# Runs the Next.js dev server from the cloned source with live reload.
services:
  web:
    image: node:22-slim
    working_dir: /app
    restart: on-failure
    ports:
      - "3000:3000"
    volumes:
      - ./:/app
      # Persist node_modules inside the container so host installs don't clobber it
      - web_node_modules:/app/node_modules
      - web_next:/app/.next
    env_file:
      - ./.env.base44-defaults   # placeholders — app boots without credentials
      - /run/base44/app.env       # platform secrets — LAST, always wins
    environment:
      - NODE_ENV=development
      - BASE44_PUBLIC_HOST_SUFFIX=${BASE44_PUBLIC_HOST_SUFFIX}
      - __VITE_ADDITIONAL_SERVER_ALLOWED_HOSTS
      - PORT=3000
      - HOSTNAME=0.0.0.0
    command: ["sh", "-ec", "corepack enable && pnpm install --frozen-lockfile && exec pnpm dev --hostname 0.0.0.0 --port 3000"]
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://localhost:3000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 60s

volumes:
  web_node_modules:
  web_next:
